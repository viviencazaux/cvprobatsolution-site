server {
    listen 80;
    listen [::]:80;

    server_name cvprobatsolution.fr www.cvprobatsolution.fr;

    root /var/www/cvprobatsolution.fr;
    index index.html;

    access_log /var/log/nginx/cvprobatsolution.fr.access.log;
    error_log /var/log/nginx/cvprobatsolution.fr.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ~* \.(css|js|jpg|jpeg|png|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
}
